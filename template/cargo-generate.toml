[template]
cargo_generate_version = ">=0.21"

[placeholders]
app_title = { type = "string", prompt = "App title (title bar + window)?", default = "My App" }
shell_repo = { type = "string", prompt = "app-shell git URL?", default = "https://github.com/joneseysinno/JoInn-Template" }
shell_tag = { type = "string", prompt = "app-shell tag?", default = "v0.1.0" }
