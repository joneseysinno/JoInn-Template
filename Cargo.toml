[workspace]
resolver = "2"
members = ["crates/app-shell", "demo"]
exclude = ["template"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
dioxus = { version = "0.7.10", default-features = false }
app-shell = { path = "crates/app-shell" }
