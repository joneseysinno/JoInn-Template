[package]
name = "app-shell"
description = "Reusable Onshape-style application shell for Dioxus: title bar, nav rail + panes, per-document toolbar, side/bottom icon rails, command palette."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Renderer-agnostic: the shell only needs the core UI features.
# The *app* picks desktop / web / mobile.
dioxus = { workspace = true, features = ["lib"] }

[dev-dependencies]
dioxus = { workspace = true, features = ["lib", "ssr"] }
